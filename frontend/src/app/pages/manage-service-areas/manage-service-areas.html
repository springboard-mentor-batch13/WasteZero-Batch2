<div class="service-area-page">

  <div class="page-header">
    <h2>Manage Service Areas</h2>
    <p>
      Configure the locations where your NGO provides pickup services.
    </p>
  </div>

  <div class="card">

    <div class="form-group">

      <label>State</label>

      <input
        type="text"
        [(ngModel)]="state"
        placeholder="Enter State">

    </div>

    <div class="form-group">

      <label>City</label>

      <input
        type="text"
        [(ngModel)]="city"
        placeholder="Enter City">

    </div>

    <hr>

    <div class="form-group">

      <label>Add Service Area</label>

      <div class="add-row">

        <input
          type="text"
          [(ngModel)]="newArea"
          placeholder="Enter Area">

        <button
          class="add-btn"
          (click)="addArea()">

          Add

        </button>

      </div>

    </div>

    <div class="service-list">

      <div
        class="service-item"
        *ngFor="let area of serviceAreas; let i = index">

        <span>{{ area }}</span>

        <button
          class="remove-btn"
          (click)="removeArea(i)">

          ✕

        </button>

      </div>

    </div>

    <button
      class="save-btn"
      (click)="save()">

      Save Service Areas

    </button>

  </div>

</div>
